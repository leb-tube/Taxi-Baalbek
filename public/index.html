<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taxi Lebanon</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Tahoma, sans-serif; background: #f0f2f5; }
.screen { display: none; min-height: 100vh; }
.screen.active { display: block; }
#auth-screen { display: none; align-items: center; justify-content: center; padding: 20px; }
#auth-screen.active { display: flex; }
.auth-container { background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.08); width: 100%; max-width: 420px; }
.auth-container h1 { text-align: center; margin-bottom: 20px; }
.tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
.tab { flex: 1; padding: 12px; background: none; border: none; cursor: pointer; font-size: 15px; color: #888; border-bottom: 3px solid transparent; }
.tab.active { color: #111; border-bottom-color: #ffc107; font-weight: bold; }
.tab-content { display: none; }
.tab-content.active { display: block; }
input[type=text], input[type=tel], input[type=password] { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
input:focus { outline: none; border-color: #ffc107; }
.btn-primary, .btn-secondary, .btn-logout, .btn-danger { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; }
.btn-primary { background: #ffc107; color: #111; width: 100%; }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-secondary { background: #e0e0e0; color: #333; }
.btn-danger { background: #dc3545; color: #fff; }
.btn-logout { background: #ff4d4d; color: #fff; padding: 8px 15px; font-size: 13px; }
.role-selector { display: flex; gap: 10px; margin-bottom: 12px; }
.role-card { flex: 1; padding: 15px; border: 2px solid #ddd; border-radius: 10px; cursor: pointer; text-align: center; }
.role-card input { display: none; }
.role-card:has(input:checked) { border-color: #ffc107; background: #fffbea; }
.role-icon { font-size: 28px; display: block; margin-bottom: 5px; }
.hidden { display: none !important; }
.error { color: #e74c3c; font-size: 14px; text-align: center; margin-top: 8px; }
.app-header { background: #111; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
#customer-map, #driver-map { height: 50vh; width: 100%; }
.bottom-panel { background: #fff; padding: 15px; border-radius: 16px 16px 0 0; margin-top: -16px; position: relative; z-index: 1000; min-height: 30vh; max-height: 45vh; overflow-y: auto; }
.actions { display: flex; gap: 10px; margin: 10px 0; }
.actions .btn-primary, .actions .btn-secondary, .actions .btn-danger { flex: 1; }
.ride-card { background: #fffbea; border: 2px solid #ffc107; padding: 15px; margin: 10px 0; border-radius: 12px; }
.ride-card h4 { margin-bottom: 10px; color: #111; }
.ride-card p { margin: 5px 0; font-size: 14px; }
.btn-accept { background: #28a745; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
.btn-call { background: #007bff; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; margin-top: 10px; margin-left: 5px; }
.info-card { background: #e8f5e9; border: 2px solid #28a745; padding: 15px; margin: 10px 0; border-radius: 12px; }
.info-card h4 { margin-bottom: 10px; color: #1b5e20; }
.info-card p { margin: 5px 0; font-size: 14px; }
.notification { position: fixed; top: 20px; right: 20px; background: #333; color: #fff; padding: 15px 25px; border-radius: 10px; z-index: 9999; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.3); max-width: 350px; }
.driver-badge { display: inline-block; background: #28a745; color: #fff; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
.driver-badge.busy { background: #dc3545; }
.searching { text-align: center; padding: 20px; }
.searching .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #ffc107; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* ═══ مربع البحث ═══ */
.search-box {
  position: absolute;
  top: 10px;
  right: 10px;
  left: 10px;
  z-index: 1001;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
  display: none;
}
.search-box.active { display: block; }
.search-box input {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-family: Tahoma, sans-serif;
  margin: 0;
}
.search-box input:focus { outline: 2px solid #ffc107; }
.search-results {
  max-height: 250px;
  overflow-y: auto;
  border-top: 1px solid #eee;
}
.search-result-item {
  padding: 12px;
  cursor: pointer;
  border-bottom: 1px solid #f0f0f0;
  font-size: 13px;
  transition: .2s;
}
.search-result-item:hover { background: #fffbea; }
.search-result-item .title { font-weight: bold; color: #111; margin-bottom: 3px; }
.search-result-item .subtitle { color: #666; font-size: 12px; }
.search-toggle {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 1001;
  background: #ffc107;
  border: 2px solid #111;
  border-radius: 8px;
  padding: 10px 15px;
  cursor: pointer;
  font-size: 18px;
  font-weight: bold;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.search-toggle:hover {
  background: #ffb300;
}
.map-wrapper { position: relative; }
/* ═══ حل مشكلة RTL/LTR للنصوص المختلطة ═══ */
.leaflet-popup-content,
.search-result-item .title,
.search-result-item .subtitle,
.info-card p,
.ride-card p {
  unicode-bidi: plaintext;
}

.leaflet-popup-content b,
.search-result-item .title,
.search-result-item .subtitle {
  unicode-bidi: plaintext;
  direction: auto;
}
* {
  unicode-bidi: plaintext;
}
</style>
</head>
<body>

<div id="notification" class="notification"></div>

<div id="auth-screen" class="screen active">
  <div class="auth-container">
    <h1>🚕 Taxi Lebanon</h1>
    <div class="tabs">
      <button class="tab active" data-tab="login">تسجيل الدخول</button>
      <button class="tab" data-tab="register">حساب جديد</button>
    </div>
    <form id="login-form" class="tab-content active">
      <input type="tel" id="login-phone" placeholder="رقم الهاتف" required>
      <input type="password" id="login-password" placeholder="كلمة المرور" required>
      <button type="submit" class="btn-primary">دخول</button>
      <p class="error" id="login-error"></p>
    </form>
    <form id="register-form" class="tab-content">
      <input type="text" id="reg-name" placeholder="الاسم الكامل" required>
      <input type="tel" id="reg-phone" placeholder="رقم الهاتف" required>
      <input type="password" id="reg-password" placeholder="كلمة المرور (6+)" required minlength="6">
      <div class="role-selector">
        <label class="role-card">
          <input type="radio" name="role" value="customer" checked>
          <div><span class="role-icon">🧍</span><span>زبون</span></div>
        </label>
        <label class="role-card">
          <input type="radio" name="role" value="driver">
          <div><span class="role-icon">🚗</span><span>سائق</span></div>
        </label>
      </div>
      <div id="driver-fields" class="hidden">
        <input type="text" id="reg-car-model" placeholder="نوع السيارة">
        <input type="text" id="reg-car-plate" placeholder="رقم اللوحة">
      </div>
      <button type="submit" class="btn-primary">إنشاء الحساب</button>
      <p class="error" id="reg-error"></p>
    </form>
  </div>
</div>

<div id="customer-screen" class="screen">
  <header class="app-header">
    <span>🧍 مرحباً، <b id="customer-name"></b></span>
    <button class="btn-logout" onclick="logout()">خروج</button>
  </header>
  <div class="map-wrapper">
    <div id="customer-map"></div>
    <button class="search-toggle" id="search-toggle" title="بحث بالعنوان">🔍</button>
    <div class="search-box" id="search-box">
      <input type="text" id="search-input" placeholder="اكتب اسم مكان... (مطعم، فندق، شارع)">
      <div class="search-results" id="search-results"></div>
    </div>
  </div>
  <div class="bottom-panel">
    <div id="customer-hint">📍 جاري تحديد موقعك...</div>
    <div class="actions" id="customer-actions">
      <button class="btn-secondary" onclick="clearSelection()">مسح</button>
      <button class="btn-primary" id="request-btn" disabled>اطلب تاكسي</button>
    </div>
    <div id="ride-status"></div>
  </div>
</div>

<div id="driver-screen" class="screen">
  <header class="app-header">
    <span>🚗 مرحباً، <b id="driver-name"></b></span>
    <button class="btn-logout" onclick="logout()">خروج</button>
  </header>
  <div id="driver-map"></div>
  <div class="bottom-panel">
    <button class="btn-primary" id="toggle-online">🟢 ابدأ استقبال الطلبات</button>
    <div id="requests-list"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const LEBANON_CENTER = [33.8547, 35.8623];
const LEBANON_ZOOM = 9;
const LOCATION_UPDATE_INTERVAL = 5000;

const API = { 
  token: localStorage.getItem("token"), 
  user: JSON.parse(localStorage.getItem("user") || "null") 
};

function saveSession(token, user) { 
  API.token = token; API.user = user; 
  localStorage.setItem("token", token); 
  localStorage.setItem("user", JSON.stringify(user)); 
}
function logout() { localStorage.clear(); location.reload(); }
function showScreen(id) { 
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active")); 
  document.getElementById(id).classList.add("active"); 
}
function notify(msg, duration = 3500) {
  const el = document.getElementById("notification");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => el.style.display = "none", duration);
}
function routeByRole() {
  if (!API.token || !API.user) return showScreen("auth-screen");
  if (API.user.role === "driver") {
    document.getElementById("driver-name").textContent = API.user.name;
    showScreen("driver-screen");
    initDriverApp();
  } else {
    document.getElementById("customer-name").textContent = API.user.name;
    showScreen("customer-screen");
    initCustomerApp();
  }
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.tab + "-form").classList.add("active");
  };
});
document.querySelectorAll("input[name=role]").forEach(r => {
  r.onchange = () => { 
    document.getElementById("driver-fields").classList.toggle("hidden", r.value !== "driver"); 
  };
});

document.getElementById("login-form").onsubmit = async (e) => {
  e.preventDefault();
  const errEl = document.getElementById("login-error");
  errEl.textContent = "";
  try {
    const res = await fetch("/api/auth/login", { 
      method: "POST", 
      headers: { "Content-Type": "application/json" }, 
      body: JSON.stringify({ 
        phone: document.getElementById("login-phone").value.trim(), 
        password: document.getElementById("login-password").value 
      }) 
    });
    const data = await res.json();
    if (data.error) return errEl.textContent = data.error;
    saveSession(data.token, data.user);
    routeByRole();
  } catch (err) {
    errEl.textContent = "خطأ في الاتصال";
  }
};

document.getElementById("register-form").onsubmit = async (e) => {
  e.preventDefault();
  const role = document.querySelector("input[name=role]:checked").value;
  const errEl = document.getElementById("reg-error");
  errEl.textContent = "";
  try {
    const res = await fetch("/api/auth/register", { 
      method: "POST", 
      headers: { "Content-Type": "application/json" }, 
      body: JSON.stringify({ 
        name: document.getElementById("reg-name").value.trim(), 
        phone: document.getElementById("reg-phone").value.trim(), 
        password: document.getElementById("reg-password").value, 
        role, 
        carModel: document.getElementById("reg-car-model").value, 
        carPlate: document.getElementById("reg-car-plate").value 
      }) 
    });
    const data = await res.json();
    if (data.error) return errEl.textContent = data.error;
    saveSession(data.token, data.user);
    routeByRole();
  } catch (err) {
    errEl.textContent = "خطأ في الاتصال";
  }
};

routeByRole();

// ═══════════════════════════════════════
// 🗺️ دالة إضافة الطبقات
// ═══════════════════════════════════════
function addMapLayers(map) {
  // ═══ 1. Streets (OpenStreetMap) ═══
  const streetsLayer = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    { 
      attribution: "© OpenStreetMap", 
      maxZoom: 19 
    }
  );

  // ═══ 2. Satellite (Esri) ═══
  const satelliteLayer = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { 
      attribution: "© Esri", 
      maxZoom: 22,
      maxNativeZoom: 17
    }
  );

  // ═══ 3. Hybrid: Satellite + Street Names + POI ═══
// ═══ Hybrid: قمر صناعي + كل التفاصيل (Esri + Stadia) ═══
 
const hybridLayer = L.layerGroup([
  // 1. القمر الصناعي
  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { attribution: "© Esri", maxZoom: 22, maxNativeZoom: 17 }
  ),
  
  // 2. الطرق (Esri Transportation)
  L.tileLayer(
    "https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}",
    { 
      attribution: "© Esri", 
      maxZoom: 22, 
      maxNativeZoom: 19,
      opacity: 0.9
    }
  ),
  
  // 3. أسماء الأماكن والحدود (Esri Places)
  L.tileLayer(
    "https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
    { 
      attribution: "© Esri", 
      maxZoom: 22, 
      maxNativeZoom: 17, 
      opacity: 0.9
    }
  ),
  
  // 4. أسماء إضافية (Stadia — Domain Auth، بدون مفتاح)
  L.tileLayer(
    "https://tiles.stadiamaps.com/tiles/stamen_toner_labels/{z}/{x}/{y}{r}.png",
    { 
      attribution: "© Stadia Maps, © Stamen",
      maxZoom: 20,
      subdomains: "abcd",
      opacity: 0.85
    }
  )
]);

  // ═══ Default layer ═══
  streetsLayer.addTo(map);

  // ═══ Layer switcher ═══
  L.control.layers({
    "🗺️ شوارع": streetsLayer,
    "🛰️ قمر صناعي": satelliteLayer,
    "🌍 هجين": hybridLayer
  }, null, {
    position: "topright",
    collapsed: false
  }).addTo(map);

  // ═══ Move layers button down ═══
  setTimeout(function() {
    const layersControl = document.querySelector('.leaflet-control-layers');
    if (layersControl) {
      layersControl.style.marginTop = '70px';
    }
  }, 100);
}

// ═══════════════════════════════════════
// 🔍 دالة البحث بالعنوان (Nominatim)
// ═══════════════════════════════════════
async function searchAddress(query) {
  if (!query || query.length < 3) return [];
  
  try {
    // ⚠️ نستخدم السيرفر كوسيط (proxy)
    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
    
    if (!res.ok) {
      console.error("Search server error:", res.status);
      return [];
    }
    
    return await res.json();
  } catch (err) {
    console.error("Search error:", err);
    return [];
  }
}

// ═══ Debounce طويل + cache ═══
// ═══ Debounce + Cache + Loading للـ POI ═══
let poiDebounceTimeout = null;
let poiLoading = false;                     // ← ⚠️ هذا السطر الناقص
const poiClientCache = new Map();
const POI_CLIENT_TTL = 10 * 60 * 1000;

function scheduleLoadPOIs(map) {
  clearTimeout(poiDebounceTimeout);
  poiDebounceTimeout = setTimeout(() => loadPOIs(map), 1500); // ← زدناها 1500ms
}
 async function loadPOIs(map) {
  if (poiLoading) {
    console.log("⏳ POI loading in progress, skipping...");
    return;
  }
  
  const bounds = map.getBounds();
  const zoom = map.getZoom();
  
  if (zoom < 14) return;
  
  const south = bounds.getSouth().toFixed(4);
  const west = bounds.getWest().toFixed(4);
  const north = bounds.getNorth().toFixed(4);
  const east = bounds.getEast().toFixed(4);
  
  const cacheKey = `${zoom}_${south}_${west}_${north}_${east}`;
  
  const cached = poiClientCache.get(cacheKey);
  if (cached && Date.now() - cached.time < POI_CLIENT_TTL) {
    renderPOIs(map, cached.data);
    console.log(`📦 Cache: ${cached.data.elements.length} POIs`);
    return;
  }
  
  poiLoading = true;
  
  try {
    const url = `/api/pois?south=${south}&west=${west}&north=${north}&east=${east}&zoom=${zoom}`;
    
    const res = await fetch(url);
    
    if (!res.ok) {
      console.warn("POI server returned:", res.status);
      return;
    }
    
    const data = await res.json();
    
    poiClientCache.set(cacheKey, { data: data, time: Date.now() });
    
    renderPOIs(map, data);
    
    if (data.elements && data.elements.length > 0) {
      console.log(`✅ Loaded ${data.elements.length} POIs`);
    }
  } catch (err) {
    console.warn("POI load error:", err.message);
  } finally {
    poiLoading = false;
  }
}

// ═══ دالة رسم POI (منفصلة) ═══
function renderPOIs(map, data) {
  if (!data.elements) return;
  
  // امسح القديمة
  if (window.poiLayer) {
    map.removeLayer(window.poiLayer);
  }
  
  window.poiLayer = L.layerGroup().addTo(map);
  
  const icons = {
    restaurant: "🍽️", cafe: "☕", fast_food: "🍔",
    hospital: "🏥", pharmacy: "💊", fuel: "⛽",
    bank: "🏦", police: "🚔", hotel: "🏨",
    guest_house: "🏠", hostel: "🏨"
  };
  
  let count = 0;
  data.elements.forEach(el => {
    if (!el.lat || !el.lon) return;
    const type = el.tags.amenity || el.tags.tourism;
    const name = el.tags.name || el.tags["name:ar"] || el.tags["name:en"];
    if (!name) return;
    
    const icon = icons[type] || "📍";
    
    const marker = L.marker([el.lat, el.lon], {
      icon: L.divIcon({
        html: '<div style="font-size:22px;text-shadow:0 1px 3px rgba(0,0,0,.7);background:rgba(255,255,255,.9);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)">' + icon + '</div>',
        className: "",
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      })
    });
    
    const safeName = '<span dir="auto" style="unicode-bidi: plaintext">' + name + '</span>';
marker.bindPopup('<b>' + icon + ' <span dir="auto" style="unicode-bidi: plaintext">' + name + '</span></b>'
);
    window.poiLayer.addLayer(marker);
    count++;
  });
}
// ═══════════════════════════════════════
// 🧍 تطبيق الزبون
// ═══════════════════════════════════════
let customerMap, customerMarkers = [], customerPoints = [], socket;
let driversMarkers = {};
let currentRideId = null;
let customerGPSMarker = null;
let customerGPSLat = null, customerGPSLng = null;
let activeDriverId = null;               // ← ⚠️ جديد  
 
  function initCustomerApp() {
  if (customerMap) return;
  socket = io();
let driverLocationMarker = null;
  customerMap = L.map("customer-map").setView(LEBANON_CENTER, LEBANON_ZOOM);
  addMapLayers(customerMap);
 // ═══ تحميل POI عند الحركة والزوم ═══

customerMap.on("moveend", () => scheduleLoadPOIs(customerMap));
customerMap.on("zoomend", () => scheduleLoadPOIs(customerMap));

  // تحميل أولي بعد 2 ثانية
  setTimeout(() => loadPOIs(customerMap), 2000);

  // ═══ تحديد موقع الزبون تلقائياً ═══
  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(
      (pos) => {
        customerGPSLat = pos.coords.latitude;
        customerGPSLng = pos.coords.longitude;
        
        if (customerGPSMarker) {
          customerGPSMarker.setLatLng([customerGPSLat, customerGPSLng]);
        } else {
          const myIcon = L.divIcon({
            html: '<div style="background:#007bff;color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)">📍</div>',
            className: "",
            iconSize: [36, 36],
            iconAnchor: [18, 18]
          });
          
          customerGPSMarker = L.marker([customerGPSLat, customerGPSLng], { icon: myIcon })
            .addTo(customerMap)
            .bindPopup("<b>📍 موقعك الحالي</b>").openPopup();
          
          customerMap.setView([customerGPSLat, customerGPSLng], 15);
        }
        
        if (customerPoints.length === 0 && !currentRideId) {

  socket.on("ride-accepted", ({ rideId, driver, etaMin }) => {

        '<p><b>👤 الاسم:</b> ' + driver.name + '</p>' +
        '<p><b>📞 الهاتف:</b> ' + driver.phone + '</p>' +

        '<button class="btn-danger" style="margin-top:10px;width:100%" onclick="cancelRide()">❌ إلغاء الرحلة</button>' +
      '</div>';
  });

  socket.on("ride-cancelled", ({ rideId }) => {
    if (currentRideId !== rideId) return;
// ⚠️ احذف marker السائق
    if (driverLocationMarker) {
      customerMap.removeLayer(driverLocationMarker);

    }

  });

  customerMap.on("click", (e) => {
    if (currentRideId) return;
    if (customerPoints.length >= 2) return;
    addCustomerPoint(e.latlng.lat, e.latlng.lng);

  document.getElementById("request-btn").onclick = async () => {
    const body = { 
      customerId: API.user.id,

      to: { lat: customerPoints[1].lat, lng: customerPoints[1].lng, address: customerPoints[1].label }
    };
    const res = await fetch("/api/rides", { 
      method: "POST", 
      headers: { "Content-Type": "application/json" }, 
      body: JSON.stringify(body) 
    });
    const ride = await res.json();
    currentRideId = ride._id;
    socket.emit("new-ride", { ...ride, customerSocketId: socket.id });
  };
}

// 🛣️ حساب الطريق الفعلي (OSRM)
// ═══════════════════════════════════════
async function getRoute(fromLat, fromLng, toLat, toLng) {
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${fromLng},${fromLat};${toLng},${toLat}?overview=full&geometries=geojson`;
    
    const res = await fetch(url);
    if (!res.ok) throw new Error("OSRM error");
    
    const data = await res.json();
    
    if (!data.routes || data.routes.length === 0) {
      return null;
    }
    
    const route = data.routes[0];
    
    // تحويل الإحداثيات [lng, lat] → [lat, lng] لـ Leaflet
    const coordinates = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);
    
    return {
      coordinates: coordinates,
      distance: (route.distance / 1000).toFixed(2),   // كم
      duration: Math.round(route.duration / 60)        // دقائق
    };
  } catch (err) {
    console.error("Route error:", err);
    return null;
  }
}
// ═══ إضافة نقطة (من GPS أو نقر أو بحث) ═══
function addCustomerPoint(lat, lng, label) {
  if (customerPoints.length >= 2) return;
  
  customerPoints.push({
    lat: lat,
    lng: lng,
    label: label || ""
  });
  
  const defaultLabel = customerPoints.length === 1 ? "📍 نقطة الانطلاق" : "🏁 الوجهة";
  const markerLabel = label 
    ? '<span dir="auto">📍 ' + label + '</span>' 
    : defaultLabel;
  
  const newMarker = L.marker([lat, lng])
    .addTo(customerMap)
    .bindPopup(markerLabel)
    .openPopup();
  
  customerMarkers.push(newMarker);
  
  if (customerPoints.length === 2) {
    document.getElementById("request-btn").disabled = false;
    
    // ═══ رسم الطريق الفعلي ═══
    const p1 = customerPoints[0];
    const p2 = customerPoints[1];
    
    // ⚠️ ارسم خطاً مؤقتاً (مستقيماً) أولاً
    const tempLine = L.polyline(
      [[p1.lat, p1.lng], [p2.lat, p2.lng]], 
      { color: "#999", weight: 4, dashArray: "5, 10" }
    ).addTo(customerMap);
    
    // ⚠️ ثم احصل على الطريق الفعلي
    getRoute(p1.lat, p1.lng, p2.lat, p2.lng).then(route => {
      // احذف الخط المؤقت
      customerMap.removeLayer(tempLine);
      
      if (route) {
        // ✅ ارسم الطريق الفعلي
        L.polyline(route.coordinates, {
          color: "#007bff",
          weight: 6,
          opacity: 0.8,
          lineJoin: "round",
          lineCap: "round"
        }).addTo(customerMap);
        
        // اعرض المسافة والوقت
        document.getElementById("customer-hint").innerHTML = 
          `✅ جاهز للطلب — ` +
          `<b>المسافة:</b> ${route.distance} كم — ` +
          `<b>الوقت المتوقع:</b> ${route.duration} دقيقة`;
      } else {
        // ⚠️ إذا فشل OSRM، استخدم الخط المستقيم
        L.polyline(
          [[p1.lat, p1.lng], [p2.lat, p2.lng]], 
          { color: "blue", weight: 4 }
        ).addTo(customerMap);
        
        document.getElementById("customer-hint").textContent = "✅ جاهز للطلب";
      }
    });
  } else {
    document.getElementById("customer-hint").textContent = 
      "🎯 حدد الوجهة — انقر على الخريطة، أو استخدم موقعي، أو ابحث بالعنوان";
  }
}

// ═══ زر استخدام موقعي ═══
function useMyLocation() {
  if (!customerGPSLat || !customerGPSLng) {
    notify("⚠️ لم يتم تحديد موقعك بعد. انتظر قليلاً أو اسمح بالوصول للموقع.");
    return;
  }
  if (currentRideId) {
    notify("⚠️ لا يمكن التعديل أثناء رحلة");
    return;
  }
  addCustomerPoint(customerGPSLat, customerGPSLng, "موقعي الحالي");
  notify("✅ تم تحديد موقعك كنقطة انطلاق");
}

// ═══ اختيار نتيجة البحث ═══
function selectSearchResult(result) {
  if (currentRideId) {
    notify("⚠️ لا يمكن التعديل أثناء رحلة");
    return;
  }
  if (customerPoints.length >= 2) {
    notify("⚠️ تم تحديد النقطتين. اضغط 'مسح' لإعادة التحديد.");
    return;
  }
  
  addCustomerPoint(result.lat, result.lng, result.name);
  
  document.getElementById("search-box").classList.remove("active");
  document.getElementById("search-input").value = "";
  document.getElementById("search-results").innerHTML = "";
  
  customerMap.setView([result.lat, result.lng], 15);
}

window.cancelRide = () => {
  if (!currentRideId) return;
  if (!confirm("هل تريد إلغاء الطلب؟")) return;
  
  socket.emit("cancel-ride", { 
    rideId: currentRideId, 
    cancelledBy: "customer"
  });
  
  document.getElementById("ride-status").innerHTML = "";
  currentRideId = null;
  notify("✅ تم إلغاء الطلب");
  clearSelection();
};

window.clearSelection = () => {
  customerMarkers.forEach(m => m.remove());
  customerMarkers = []; customerPoints = [];
  document.getElementById("request-btn").disabled = true;
  document.getElementById("customer-hint").textContent = "📍 انقر على الخريطة، أو استخدم 'استخدام موقعي'، أو ابحث بالعنوان";
  document.getElementById("ride-status").innerHTML = "";
  if (customerMap) {
    customerMap.eachLayer(l => { if (l instanceof L.Polyline) l.remove(); });
  }
};

// 🚗 تطبيق السائق
// ═══════════════════════════════════════
let driverMap, driverMarker, driverSocket, isOnline = false;
let currentRide = null;
let myLat = LEBANON_CENTER[0], myLng = LEBANON_CENTER[1];
let locationInterval = null;

function initDriverApp() {
  if (driverMap) return;
  driverSocket = io();

  driverMap = L.map("driver-map").setView(LEBANON_CENTER, LEBANON_ZOOM);
  addMapLayers(driverMap);
 // ═══ تحميل POI عند الحركة والزوم ═══
  driverMap.on("moveend", () => scheduleLoadPOIs(driverMap));
  driverMap.on("zoomend", () => scheduleLoadPOIs(driverMap));
  
  setTimeout(() => loadPOIs(driverMap), 2000);

  if (!navigator.geolocation) {
    alert("⚠️ متصفحك لا يدعم تحديد الموقع");
    return;
  }

  navigator.geolocation.watchPosition(
    (pos) => {
      myLat = pos.coords.latitude;
      myLng = pos.coords.longitude;
      if (driverMarker) {
        driverMarker.setLatLng([myLat, myLng]);
      } else {
        driverMarker = L.marker([myLat, myLng]).addTo(driverMap).bindPopup("📍 موقعي").openPopup();
        driverMap.setView([myLat, myLng], 15);
      }
    },
    (err) => console.error("GPS:", err),
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );

  locationInterval = setInterval(() => {
    if (isOnline) {
      driverSocket.emit("driver-location", { driverId: API.user.id, lat: myLat, lng: myLng });
    }
  }, LOCATION_UPDATE_INTERVAL);

  document.getElementById("toggle-online").onclick = () => {
    isOnline = !isOnline;
    const btn = document.getElementById("toggle-online");
    btn.textContent = isOnline ? "⛔ إيقاف الاستقبال" : "🟢 ابدأ استقبال الطلبات";
    btn.style.background = isOnline ? "#28a745" : "#ffc107";
    btn.style.color = isOnline ? "#fff" : "#111";
    
    if (isOnline) {
      driverSocket.emit("driver-online", { 
        driverId: API.user.id,
        name: API.user.name,
        carModel: API.user.carModel,
        carPlate: API.user.carPlate,
        lat: myLat, lng: myLng 
      });
      notify("✅ بدأت الاستقبال");
    } else {
      driverSocket.emit("driver-offline", { driverId: API.user.id });
      notify("⛔ أوقفت الاستقبال");
    }
  };

  driverSocket.on("ride-confirmed", ({ rideId, ride, etaMin }) => {
    currentRide = { _id: rideId, ...ride, etaMin };
    
    document.getElementById("requests-list").innerHTML = `
      <div class="info-card">
        <h4>🧍 بيانات الزبون</h4>
        <p><b>👤 الاسم:</b> ${ride.customer?.name || "غير معروف"}</p>
        <p><b>📞 الهاتف:</b> ${ride.customer?.phone || "غير معروف"}</p>
        <p><b>📍 الانطلاق:</b> ${ride.from.address || "موقع الزبون"}</p>
        <p><b>🏁 الوجهة:</b> ${ride.to.address || "الوجهة"}</p>
        <p><b>⏱️ وقت الوصول:</b> ${etaMin} دقيقة</p>
        <a href="tel:${ride.customer?.phone}" class="btn-call">📞 اتصال بالزبون</a>
        <button class="btn-danger" style="margin-top:10px;width:100%" onclick="cancelRideDriver()">❌ إلغاء</button>
        <button class="btn-accept" style="background:#28a745;margin-top:8px" onclick="completeRide()">✅ إنهاء الرحلة</button>
      </div>
    `;
    
    const fromLat = ride.from.lat, fromLng = ride.from.lng;
    const toLat = ride.to.lat, toLng = ride.to.lng;
    
    L.marker([fromLat, fromLng]).addTo(driverMap).bindPopup("🟢 الزبون").openPopup();
    L.marker([toLat, toLng]).addTo(driverMap).bindPopup("🔴 الوجهة");
    
    // ═══ احصل على الطريق الفعلي للسائق ═══
    const tempLine = L.polyline(
      [[fromLat, fromLng], [toLat, toLng]], 
      { color: "#999", weight: 4, dashArray: "5, 10" }
    ).addTo(driverMap);
    
    getRoute(fromLat, fromLng, toLat, toLng).then(route => {
      driverMap.removeLayer(tempLine);
      
      if (route) {
        L.polyline(route.coordinates, {
          color: "#007bff",
          weight: 6,
          opacity: 0.85,
          lineJoin: "round",
          lineCap: "round"
        }).addTo(driverMap);
        
        console.log(`🛣️ المسار: ${route.distance} كم — ${route.duration} دقيقة`);
      } else {
        L.polyline(
          [[fromLat, fromLng], [toLat, toLng]], 
          { color: "blue", weight: 5, dashArray: "10,10" }
        ).addTo(driverMap);
      }
    });
    driverMap.fitBounds([[fromLat, fromLng], [toLat, toLng], [myLat, myLng]], { padding: [50, 50] });
    
    notify("✅ تم تأكيد القبول");
  });

  driverSocket.on("ride-request", (ride) => {
    if (currentRide) return;
    if (document.getElementById("ride-" + ride._id)) return;
    
    const card = document.createElement("div");
    card.className = "ride-card";
    card.id = "ride-" + ride._id;
    
    const distanceInfo = ride.distanceToCustomer 
      ? `<p style="color:#28a745;font-weight:bold">📏 المسافة: ${ride.distanceToCustomer} كم</p>
         <p style="color:#007bff;font-weight:bold">⏱️ الوصول المتوقع: ${ride.etaMin} دقيقة</p>` 
      : "";
    
    card.innerHTML = `
      <h4>🚕 طلب جديد</h4>
      ${distanceInfo}
      <p><b>👤 الزبون:</b> ${ride.customer?.name || "غير معروف"}</p>
      <p><b>📞 الهاتف:</b> ${ride.customer?.phone || "غير معروف"}</p>
      <p><b>📍 من:</b> ${ride.from.address || "موقع الزبون"}</p>
      <p><b>🏁 إلى:</b> ${ride.to.address || "الوجهة"}</p>
      <button class="btn-accept" onclick="acceptRide('${ride._id}', ${ride.etaMin || 0})">
        ✅ قبول الطلب
      </button>
    `;
    document.getElementById("requests-list").appendChild(card);
    notify(`🚕 طلب جديد — ${ride.distanceToCustomer} كم`);
  });

  driverSocket.on("ride-removed", ({ rideId }) => {
    const card = document.getElementById("ride-" + rideId);
    if (card) card.remove();
    if (currentRide && currentRide._id === rideId) {
      currentRide = null;
      document.getElementById("requests-list").innerHTML = "";
      driverMap.eachLayer(l => {
        if ((l instanceof L.Polyline || l instanceof L.Marker) && l !== driverMarker) l.remove();
      });
    }
  });

  driverSocket.on("ride-unavailable", ({ rideId }) => {
    document.getElementById("ride-" + rideId)?.remove();
    notify("⚠️ الرحلة اتخذها سائق آخر");
  });

  driverSocket.on("customer-cancelled", ({ rideId }) => {
    document.getElementById("ride-" + rideId)?.remove();
    if (currentRide && currentRide._id === rideId) {
      currentRide = null;
 // ⚠️ احذف marker السائق
    if (driverLocationMarker) {
      customerMap.removeLayer(driverLocationMarker);
      driverLocationMarker = null;
    }
    activeDriverId = null;
      document.getElementById("requests-list").innerHTML = "";
      driverMap.eachLayer(l => {
        if ((l instanceof L.Polyline || l instanceof L.Marker) && l !== driverMarker) l.remove();
      });
      notify("⚠️ الزبون ألغى الطلب");
    }
  });
}

window.acceptRide = (rideId, etaMin) => {
  driverSocket.emit("accept-ride", { 
    rideId, 
    driverId: API.user.id, 
    etaMin 
  });
  
  const card = document.getElementById("ride-" + rideId);
  if (card) currentRide = { _id: rideId, etaMin };
  
  document.getElementById("requests-list").innerHTML = "";
  notify("⏳ جاري تأكيد القبول...");
};

window.cancelRideDriver = () => {
  if (!currentRide) return;
  if (!confirm("هل تريد إلغاء الطلب؟ سيتم البحث عن سائق آخر للزبون.")) return;
  
  driverSocket.emit("cancel-ride", { 
    rideId: currentRide._id, 
    cancelledBy: "driver"
  });
  
  currentRide = null;
  document.getElementById("requests-list").innerHTML = "";
  driverMap.eachLayer(l => {
    if ((l instanceof L.Polyline || l instanceof L.Marker) && l !== driverMarker) l.remove();
  });
  driverMap.setView([myLat, myLng], 15);
  notify("✅ تم إلغاء الطلب");
};

window.completeRide = () => {
  if (!currentRide) return;
  driverSocket.emit("ride-completed", { 
    driverId: API.user.id, 
    rideId: currentRide._id 
  });
  currentRide = null;
  document.getElementById("requests-list").innerHTML = "";
  driverMap.eachLayer(l => {
    if ((l instanceof L.Polyline || l instanceof L.Marker) && l !== driverMarker) l.remove();
  });
  driverMap.setView([myLat, myLng], 15);
  notify("✅ تم إنهاء الرحلة");
};
</script>
</body>
</html>
