<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taxi Lebanon</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Tahoma, sans-serif; background: #f0f2f5; }
.screen { display: none; min-height: 100vh; }
.screen.active { display: block; }
#auth-screen { display: none; align-items: center; justify-content: center; padding: 20px; }
#auth-screen.active { display: flex; }
.auth-container { background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.08); width: 100%; max-width: 420px; }
.auth-container h1 { text-align: center; margin-bottom: 20px; }
.tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
.tab { flex: 1; padding: 12px; background: none; border: none; cursor: pointer; font-size: 15px; color: #888; border-bottom: 3px solid transparent; }
.tab.active { color: #111; border-bottom-color: #ffc107; font-weight: bold; }
.tab-content { display: none; }
.tab-content.active { display: block; }
input[type=text], input[type=tel], input[type=password] { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
input:focus { outline: none; border-color: #ffc107; }
.btn-primary, .btn-secondary, .btn-logout, .btn-danger { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; }
.btn-primary { background: #ffc107; color: #111; width: 100%; }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-secondary { background: #e0e0e0; color: #333; }
.btn-danger { background: #dc3545; color: #fff; }
.btn-logout { background: #ff4d4d; color: #fff; padding: 8px 15px; font-size: 13px; }
.role-selector { display: flex; gap: 10px; margin-bottom: 12px; }
.role-card { flex: 1; padding: 15px; border: 2px solid #ddd; border-radius: 10px; cursor: pointer; text-align: center; }
.role-card input { display: none; }
.role-card:has(input:checked) { border-color: #ffc107; background: #fffbea; }
.role-icon { font-size: 28px; display: block; margin-bottom: 5px; }
.hidden { display: none !important; }
.error { color: #e74c3c; font-size: 14px; text-align: center; margin-top: 8px; }
.app-header { background: #111; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
#customer-map, #driver-map { height: 50vh; width: 100%; }
.bottom-panel { background: #fff; padding: 15px; border-radius: 16px 16px 0 0; margin-top: -16px; position: relative; z-index: 1000; min-height: 30vh; max-height: 45vh; overflow-y: auto; }
.actions { display: flex; gap: 10px; margin: 10px 0; }
.actions .btn-primary, .actions .btn-secondary, .actions .btn-danger { flex: 1; }
.ride-card { background: #fffbea; border: 2px solid #ffc107; padding: 15px; margin: 10px 0; border-radius: 12px; }
.ride-card h4 { margin-bottom: 10px; color: #111; }
.ride-card p { margin: 5px 0; font-size: 14px; }
.btn-accept { background: #28a745; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
.btn-call { background: #007bff; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; margin-top: 10px; margin-left: 5px; }
.info-card { background: #e8f5e9; border: 2px solid #28a745; padding: 15px; margin: 10px 0; border-radius: 12px; }
.info-card h4 { margin-bottom: 10px; color: #1b5e20; }
.info-card p { margin: 5px 0; font-size: 14px; }
.notification { position: fixed; top: 20px; right: 20px; background: #333; color: #fff; padding: 15px 25px; border-radius: 10px; z-index: 9999; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.3); max-width: 350px; }
.searching { text-align: center; padding: 20px; }
.searching .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #ffc107; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.search-box { position: absolute; top: 10px; right: 10px; left: 10px; z-index: 1001; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.3); max-width: 400px; margin-left: auto; margin-right: auto; display: none; }
.search-box.active { display: block; }
.search-box input { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-family: Tahoma; margin: 0; }
.search-results { max-height: 250px; overflow-y: auto; border-top: 1px solid #eee; }
.search-result-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
.search-result-item:hover { background: #fffbea; }
.search-result-item .title { font-weight: bold; color: #111; margin-bottom: 3px; }
.search-result-item .subtitle { color: #666; font-size: 12px; }
.search-toggle { position: absolute; top: 10px; right: 10px; z-index: 1001; background: #ffc107; border: 2px solid #111; border-radius: 8px; padding: 10px 15px; cursor: pointer; font-size: 18px; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.map-wrapper { position: relative; }
* { unicode-bidi: plaintext; }
</style>
</head>
<body>

<div id="notification" class="notification"></div>

<div id="auth-screen" class="screen active">
  <div class="auth-container">
    <h1>🚕 Taxi Lebanon</h1>
    <div class="tabs">
      <button class="tab active" data-tab="login">تسجيل الدخول</button>
      <button class="tab" data-tab="register">حساب جديد</button>
    </div>
    <form id="login-form" class="tab-content active">

    <form id="register-form" class="tab-content">

        <label class="role-card">
          <input type="radio" name="role" value="customer" checked>

        <label class="role-card">

          <div><span class="role-icon">🚗</span><span>سائق</span></div>

      </div>

        <input type="text" id="reg-car-plate" placeholder="رقم اللوحة">

</div>

<div id="customer-screen" class="screen">
  <header class="app-header">
    <span>🧍 مرحباً، <b id="customer-name"></b></span>
    <button class="btn-logout" onclick="logout()">خروج</button>
  </header>
  <div class="map-wrapper">
    <div id="customer-map"></div>
    <button class="search-toggle" id="search-toggle" title="بحث بالعنوان">🔍</button>
    <div class="search-box" id="search-box">
      <input type="text" id="search-input" placeholder="اكتب اسم مكان...">
      <div class="search-results" id="search-results"></div>

  </div>

    <div id="customer-hint">📍 جاري تحديد موقعك...</div>
    <div class="actions" id="customer-actions">
      <button class="btn-secondary" onclick="clearSelection()">مسح</button>

  </header>
  <div id="driver-map"></div>
  <div class="bottom-panel">

    <div id="requests-list"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
// ═══════════════════════════════════════
// 🔍 Device Fingerprint (inline)
// ═══════════════════════════════════════
async function getDeviceFingerprint() {
  let stored = localStorage.getItem("device_fingerprint");
  if (stored) return stored;
  
  const components = [
    navigator.userAgent,
    navigator.language,
    screen.width + "x" + screen.height,
    screen.colorDepth,
    new Date().getTimezoneOffset(),
    navigator.hardwareConcurrency || 0,
    navigator.platform || "unknown",
  ];
  
  try {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    ctx.textBaseline = "top";
    ctx.font = "14px Arial";
    ctx.fillText("TaxiApp-Fingerprint", 2, 2);
    components.push(canvas.toDataURL().slice(-50));
  } catch (e) {}
  
  try {
    const gl = document.createElement("canvas").getContext("webgl");
    const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
    if (debugInfo) components.push(gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL));
  } catch (e) {}
  
  const raw = components.join("|");
  const buffer = new TextEncoder().encode(raw);
  const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  const hash = hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
  
  localStorage.setItem("device_fingerprint", hash);
  return hash;
}

let deviceFingerprint = null;
getDeviceFingerprint().then(fp => {
  deviceFingerprint = fp;
  console.log("🔍 Device ID:", fp.substring(0, 20) + "...");
}).catch(err => {
  console.error("Fingerprint error:", err);
  deviceFingerprint = "unknown_" + Date.now();
});

// ═══════════════════════════════════════
// ⚙️ المتغيرات الأساسية
// ═══════════════════════════════════════
const LEBANON_CENTER = [33.8547, 35.8623];
const LEBANON_ZOOM = 9;
const LOCATION_UPDATE_INTERVAL = 2000;

const API = { 
  token: localStorage.getItem("token"), 
  user: JSON.parse(localStorage.getItem("user") || "null") 
};

let socket = null;
let driverSocket = null;

function saveSession(token, user) { 
  API.token = token; API.user = user; 
  localStorage.setItem("token", token); 
  localStorage.setItem("user", JSON.stringify(user)); 
}
function logout() { localStorage.clear(); location.reload(); }
function showScreen(id) { 
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active")); 
  document.getElementById(id).classList.add("active"); 
}

function notify(msg, duration = 3500) {
  const el = document.getElementById("notification");
  if (el) {
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(() => el.style.display = "none", duration);
  }
}

// ═══════════════════════════════════════
// 🔔 إشعار صوتي
// ═══════════════════════════════════════
function playBeep(type = "default") {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sounds = {
      new_ride: [{ freq: 800, duration: 0.15, delay: 0 }, { freq: 1000, duration: 0.15, delay: 0.2 }, { freq: 800, duration: 0.15, delay: 0.4 }, { freq: 1000, duration: 0.3, delay: 0.6 }],
      accepted: [{ freq: 523, duration: 0.15, delay: 0 }, { freq: 659, duration: 0.15, delay: 0.15 }, { freq: 784, duration: 0.3, delay: 0.3 }],
      arrived: [{ freq: 660, duration: 0.2, delay: 0 }, { freq: 880, duration: 0.2, delay: 0.25 }, { freq: 660, duration: 0.2, delay: 0.5 }, { freq: 880, duration: 0.4, delay: 0.75 }]
    };
    const notes = sounds[type] || sounds.accepted;
    notes.forEach(note => {
      setTimeout(() => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = note.freq;
        osc.type = "sine";
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + note.duration);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + note.duration);
      }, note.delay * 1000);
    });
  } catch (err) { console.error("Sound error:", err); }
}

document.addEventListener("click", () => {
  if (!window.audioEnabled) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      ctx.resume();
      window.audioEnabled = true;
      console.log("🔊 Audio enabled");
    } catch (e) {}
  }
}, { once: true });

function routeByRole() {
  if (!API.token || !API.user) return showScreen("auth-screen");
  if (API.user.role === "driver") {
    document.getElementById("driver-name").textContent = API.user.name;
    showScreen("driver-screen");
    initDriverApp();
  } else {
    document.getElementById("customer-name").textContent = API.user.name;
    showScreen("customer-screen");
    initCustomerApp();
  }
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.tab + "-form").classList.add("active");
  };
});

document.querySelectorAll("input[name=role]").forEach(r => {
  r.onchange = () => { 
    document.getElementById("driver-fields").classList.toggle("hidden", r.value !== "driver"); 
  };
});

// ═══════════════════════════════════════
// 🗺️ الخرائط
// ═══════════════════════════════════════
function addMapLayers(map) {
  const streetsLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap", maxZoom: 19 });
  const satelliteLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { attribution: "© Esri", maxZoom: 22, maxNativeZoom: 17 });
  const hybridLayer = L.layerGroup([
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { attribution: "© Esri", maxZoom: 22, maxNativeZoom: 17 }),
    L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}", { attribution: "© Esri", maxZoom: 22, maxNativeZoom: 19, opacity: 0.9 }),
    L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { attribution: "© Esri", maxZoom: 22, maxNativeZoom: 17, opacity: 0.9 }),
    L.tileLayer("https://tiles.stadiamaps.com/tiles/stamen_toner_labels/{z}/{x}/{y}{r}.png", { attribution: "© Stadia Maps", maxZoom: 20, subdomains: "abcd", opacity: 0.85 })
  ]);
  streetsLayer.addTo(map);
  L.control.layers({ "🗺️ شوارع": streetsLayer, "🛰️ قمر صناعي": satelliteLayer, "🌍 هجين": hybridLayer }, null, { position: "topright", collapsed: false }).addTo(map);
  setTimeout(() => { const c = document.querySelector('.leaflet-control-layers'); if (c) c.style.marginTop = '70px'; }, 100);
}

async function searchAddress(query) {
  if (!query || query.length < 3) return [];
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
    if (!res.ok) return [];
    return await res.json();
  } catch (err) { return []; }
}

let poiDebounceTimeout = null;
let poiLoading = false;
const poiClientCache = new Map();
const POI_CLIENT_TTL = 10 * 60 * 1000;

function scheduleLoadPOIs(map) {
  clearTimeout(poiDebounceTimeout);
  poiDebounceTimeout = setTimeout(() => loadPOIs(map), 1500); 
}

async function loadPOIs(map) {
  if (poiLoading) return;
  const bounds = map.getBounds();
  const zoom = map.getZoom();
  if (zoom < 14) return;
  
  const south = bounds.getSouth().toFixed(4);
  const west = bounds.getWest().toFixed(4);
  const north = bounds.getNorth().toFixed(4);
  const east = bounds.getEast().toFixed(4);
  const cacheKey = `${zoom}_${south}_${west}_${north}_${east}`;
  
  const cached = poiClientCache.get(cacheKey);
  if (cached && Date.now() - cached.time < POI_CLIENT_TTL) { renderPOIs(map, cached.data); return; }
  
  poiLoading = true;
  try {
    const res = await fetch(`/api/pois?south=${south}&west=${west}&north=${north}&east=${east}&zoom=${zoom}`);
    if (!res.ok) return;
    const data = await res.json();
    poiClientCache.set(cacheKey, { data: data, time: Date.now() });
    renderPOIs(map, data);
  } catch (err) { console.warn("POI error:", err.message); } 
  finally { poiLoading = false; }
}

function renderPOIs(map, data) {
  if (!data.elements) return;
  if (window.poiLayer) map.removeLayer(window.poiLayer);
  window.poiLayer = L.layerGroup().addTo(map);
  const icons = { restaurant: "🍽️", cafe: "☕", fast_food: "🍔", hospital: "🏥", pharmacy: "💊", fuel: "⛽", bank: "🏦", police: "🚔", hotel: "🏨" };
  data.elements.forEach(el => {
    if (!el.lat || !el.lon) return;
    const type = el.tags.amenity || el.tags.tourism;
    const name = el.tags.name || el.tags["name:ar"] || el.tags["name:en"];
    if (!name) return;
    const icon = icons[type] || "📍";
    L.marker([el.lat, el.lon], { icon: L.divIcon({ html: '<div style="font-size:22px;text-shadow:0 1px 3px rgba(0,0,0,.7);background:rgba(255,255,255,.9);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:2px solid #fff">' + icon + '</div>', className: "", iconSize: [32, 32], iconAnchor: [16, 16] }) }).addTo(window.poiLayer).bindPopup('<b>' + icon + ' ' + name + '</b>');
  });
}

// ═══════════════════════════════════════
// 🧍 تطبيق الزبون
// ═══════════════════════════════════════
let customerMap, customerMarkers = [], customerPoints = [];
let driversMarkers = {};
let currentRideId = null;
let customerGPSMarker = null;
let customerGPSLat = null, customerGPSLng = null;
let activeDriverId = null;

function initCustomerApp() {
  if (customerMap) return;
  if (typeof io === "undefined") return;
  socket = io();
  
  let driverLocationMarker = null;
  customerMap = L.map("customer-map").setView(LEBANON_CENTER, LEBANON_ZOOM);
  addMapLayers(customerMap);
  customerMap.on("moveend", () => scheduleLoadPOIs(customerMap));
  customerMap.on("zoomend", () => scheduleLoadPOIs(customerMap));
  setTimeout(() => loadPOIs(customerMap), 2000);

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition((pos) => {
      customerGPSLat = pos.coords.latitude;
      customerGPSLng = pos.coords.longitude;
      if (customerGPSMarker) customerGPSMarker.setLatLng([customerGPSLat, customerGPSLng]);
      else {
        customerGPSMarker = L.marker([customerGPSLat, customerGPSLng], { icon: L.divIcon({ html: '<div style="background:#007bff;color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;border:3px solid #fff">📍</div>', className: "", iconSize: [36, 36], iconAnchor: [18, 18] }) }).addTo(customerMap).bindPopup("موقعك الحالي").openPopup();
        customerMap.setView([customerGPSLat, customerGPSLng], 15);
      }
      if (customerPoints.length === 0 && !currentRideId) {
        addCustomerPoint(customerGPSLat, customerGPSLng, "موقعي الحالي");
      }
    }, (err) => { document.getElementById("customer-hint").textContent = "⚠️ تعذّر تحديد موقعك"; }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  }

  const useMyLocationBtn = document.createElement("button");
  useMyLocationBtn.className = "btn-secondary";
  useMyLocationBtn.textContent = "📍 استخدام موقعي";
  useMyLocationBtn.style.cssText = "flex:1;background:#007bff;color:#fff;margin-left:5px";
  useMyLocationBtn.onclick = useMyLocation;
  document.getElementById("customer-actions").appendChild(useMyLocationBtn);

  const searchToggle = document.getElementById("search-toggle");
  const searchBox = document.getElementById("search-box");
  const searchInput = document.getElementById("search-input");
  const searchResults = document.getElementById("search-results");
  
  searchToggle.onclick = () => { searchBox.classList.toggle("active"); if (searchBox.classList.contains("active")) setTimeout(() => searchInput.focus(), 100); };
  
  let searchTimeout;
  searchInput.oninput = (e) => {
    clearTimeout(searchTimeout);
    const q = e.target.value.trim();
    if (q.length < 3) { searchResults.innerHTML = ""; return; }
    searchTimeout = setTimeout(async () => {
      searchResults.innerHTML = '<div style="padding:12px;text-align:center">🔍 جاري البحث...</div>';
      const results = await searchAddress(q);
      if (results.length === 0) { searchResults.innerHTML = '<div style="padding:12px;text-align:center">لا توجد نتائج</div>'; return; }
      searchResults.innerHTML = "";
      results.forEach(r => {
        const div = document.createElement("div");
        div.className = "search-result-item";
        div.innerHTML = '<div class="title">📍 ' + r.name + '</div><div class="subtitle">' + r.fullName.substring(0, 80) + '...</div>';
        div.onclick = () => selectSearchResult(r);
        searchResults.appendChild(div);
      });
    }, 500);
  };

  socket.on("drivers-list-update", (drivers) => {
    const currentIds = new Set(drivers.map(d => d.id));
    for (const id in driversMarkers) { if (!currentIds.has(id)) { driversMarkers[id].remove(); delete driversMarkers[id]; } }
    drivers.forEach(driver => {
      const color = driver.busy ? '#dc3545' : '#28a745';
      const icon = L.divIcon({ html: '<div style="background:' + color + ';color:#fff;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;border:3px solid #fff">🚗</div>', className: "", iconSize: [40, 40], iconAnchor: [20, 20] });
      if (driversMarkers[driver.id]) driversMarkers[driver.id].setLatLng([driver.lat, driver.lng]).setIcon(icon);
      else driversMarkers[driver.id] = L.marker([driver.lat, driver.lng], { icon }).addTo(customerMap).bindPopup(driver.name + ' — ' + driver.carModel);
    });
  });

  socket.on("driver-location-update", ({ driverId, lat, lng }) => {
    if (driversMarkers[driverId]) driversMarkers[driverId].setLatLng([lat, lng]);
    if (activeDriverId === driverId) {
      if (driverLocationMarker) driverLocationMarker.setLatLng([lat, lng]);
      else driverLocationMarker = L.marker([lat, lng], { icon: L.divIcon({ html: '<div style="background:#28a745;color:#fff;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;border:3px solid #fff">🚗</div>', className: "", iconSize: [44, 44], iconAnchor: [22, 22] }), zIndexOffset: 1000 }).addTo(customerMap).bindPopup("سائقك");
      if (customerGPSLat && customerGPSLng) {
        if (window.connectionLine) customerMap.removeLayer(window.connectionLine);
        window.connectionLine = L.polyline([[lat, lng], [customerGPSLat, customerGPSLng]], { color: "#28a745", weight: 3, dashArray: "5, 5", opacity: 0.6 }).addTo(customerMap);
      }
    }
  });

  socket.on("search-started", ({ driversOnline }) => {
    document.getElementById("ride-status").innerHTML = '<div class="searching"><div class="spinner"></div><p>⏳ جاري البحث...</p><p>' + driversOnline + ' سائق متصل</p><button class="btn-danger" style="width:100%" onclick="cancelRide()">❌ إلغاء</button></div>';
  });

  socket.on("search-restarted", ({ message }) => {
    document.getElementById("ride-status").innerHTML = '<div class="searching"><div class="spinner"></div><p>' + message + '</p><button class="btn-danger" style="width:100%" onclick="cancelRide()">❌ إلغاء</button></div>';
    notify(message);
  });

  socket.on("ride-accepted", ({ driver, etaMin }) => {
    activeDriverId = driver._id;
    playBeep("accepted");
    if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
    document.getElementById("ride-status").innerHTML = '<div class="info-card"><h4>✅ السائق في الطريق</h4><p><b>⏱️ الوصول:</b> ' + etaMin + ' دقيقة</p><p><b>👤:</b> ' + driver.name + '</p><p><b>📞:</b> ' + driver.phone + '</p><p><b>🚗:</b> ' + driver.carModel + ' - ' + driver.carPlate + '</p><a href="tel:' + driver.phone + '" class="btn-call">📞 اتصال</a><button class="btn-danger" style="width:100%" onclick="cancelRide()">❌ إلغاء</button></div>';
  });

  socket.on("driver-arrived", () => {
    playBeep("arrived");
    if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
    notify("📍 السائق وصل لموقعك!", 8000);
  });

  socket.on("ride-cancelled", ({ rideId }) => {
    if (currentRideId !== rideId) return;
    if (driverLocationMarker) { customerMap.removeLayer(driverLocationMarker); driverLocationMarker = null; }
    if (window.connectionLine) { customerMap.removeLayer(window.connectionLine); window.connectionLine = null; }
    activeDriverId = null;
    document.getElementById("ride-status").innerHTML = "";
    currentRideId = null;
  });

  customerMap.on("click", (e) => {
    if (currentRideId) return;
    if (customerPoints.length >= 2) return;
    addCustomerPoint(e.latlng.lat, e.latlng.lng);
  });

  document.getElementById("request-btn").onclick = async () => {
    const body = { 
      customerId: API.user.id, 
      from: { lat: customerPoints[0].lat, lng: customerPoints[0].lng, address: customerPoints[0].label },
      to: { lat: customerPoints[1].lat, lng: customerPoints[1].lng, address: customerPoints[1].label }
    };
    const res = await fetch("/api/rides", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const ride = await res.json();
    currentRideId = ride._id;
    socket.emit("new-ride", { ...ride, customerSocketId: socket.id });
  };
}

async function getRoute(fromLat, fromLng, toLat, toLng) {
  try {
    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${fromLng},${fromLat};${toLng},${toLat}?overview=full&geometries=geojson`);
    if (!res.ok) throw new Error("OSRM error");
    const data = await res.json();
    if (!data.routes || data.routes.length === 0) return null;
    const route = data.routes[0];
    return { coordinates: route.geometry.coordinates.map(c => [c[1], c[0]]), distance: (route.distance / 1000).toFixed(2), duration: Math.round(route.duration / 60) };
  } catch (err) { return null; }
}

function addCustomerPoint(lat, lng, label) {
  if (customerPoints.length >= 2) return;
  customerPoints.push({ lat, lng, label: label || "" });
  const defaultLabel = customerPoints.length === 1 ? "📍 نقطة الانطلاق" : "🏁 الوجهة";
  const markerLabel = label ? "📍 " + label : defaultLabel;
  customerMarkers.push(L.marker([lat, lng]).addTo(customerMap).bindPopup(markerLabel).openPopup());
  
  if (customerPoints.length === 2) {
    document.getElementById("request-btn").disabled = false;
    const p1 = customerPoints[0], p2 = customerPoints[1];
    const tempLine = L.polyline([[p1.lat, p1.lng], [p2.lat, p2.lng]], { color: "#999", weight: 4, dashArray: "5, 10" }).addTo(customerMap);
    getRoute(p1.lat, p1.lng, p2.lat, p2.lng).then(route => {
      customerMap.removeLayer(tempLine);
      if (route) {
        L.polyline(route.coordinates, { color: "#007bff", weight: 6, opacity: 0.8 }).addTo(customerMap);
        document.getElementById("customer-hint").innerHTML = '✅ جاهز — <b>المسافة:</b> ' + route.distance + ' كم — <b>الوقت:</b> ' + route.duration + ' دقيقة';
      } else {
        L.polyline([[p1.lat, p1.lng], [p2.lat, p2.lng]], { color: "blue", weight: 4 }).addTo(customerMap);
      }
    });
  } else {
    document.getElementById("customer-hint").textContent = "🎯 حدد الوجهة";
  }
}

function useMyLocation() {
  if (!customerGPSLat || !customerGPSLng) { notify("⚠️ لم يتم تحديد موقعك"); return; }
  if (currentRideId) { notify("⚠️ لا يمكن التعديل"); return; }
  addCustomerPoint(customerGPSLat, customerGPSLng, "موقعي الحالي");
}

function selectSearchResult(result) {
  if (currentRideId || customerPoints.length >= 2) return;
  addCustomerPoint(result.lat, result.lng, result.name);
  document.getElementById("search-box").classList.remove("active");
  document.getElementById("search-input").value = "";
  document.getElementById("search-results").innerHTML = "";
  customerMap.setView([result.lat, result.lng], 15);
}

window.cancelRide = () => {
  if (!currentRideId) return;
  if (!confirm("إلغاء الطلب؟")) return;
  socket.emit("cancel-ride", { rideId: currentRideId, cancelledBy: "customer" });
  document.getElementById("ride-status").innerHTML = "";
  currentRideId = null;
  clearSelection();
};

window.clearSelection = () => {
  customerMarkers.forEach(m => m.remove());
  customerMarkers = []; customerPoints = [];
  document.getElementById("request-btn").disabled = true;
  document.getElementById("customer-hint").textContent = "📍 انقر على الخريطة";
  document.getElementById("ride-status").innerHTML = "";
  if (customerMap) customerMap.eachLayer(l => { if (l instanceof L.Polyline) l.remove(); });
};

// ═══════════════════════════════════════
// 🚗 تطبيق السائق
// ═══════════════════════════════════════
let driverMap, driverMarker, isOnline = false;
let currentRide = null;
let myLat = LEBANON_CENTER[0], myLng = LEBANON_CENTER[1];
let locationInterval = null;

function initDriverApp() {
  if (driverMap) return;
  if (typeof io === "undefined") return;
  driverSocket = io();
  
  driverMap = L.map("driver-map").setView(LEBANON_CENTER, LEBANON_ZOOM);
  addMapLayers(driverMap);
  driverMap.on("moveend", () => scheduleLoadPOIs(driverMap));
  driverMap.on("zoomend", () => scheduleLoadPOIs(driverMap));
  setTimeout(() => loadPOIs(driverMap), 2000);

  if (!navigator.geolocation) { alert("⚠️ لا يدعم الموقع"); return; }
  navigator.geolocation.watchPosition((pos) => {
    myLat = pos.coords.latitude; myLng = pos.coords.longitude;
    if (driverMarker) driverMarker.setLatLng([myLat, myLng]);
    else { driverMarker = L.marker([myLat, myLng]).addTo(driverMap).bindPopup("موقعي").openPopup(); driverMap.setView([myLat, myLng], 15); }
  }, (err) => console.error("GPS:", err), { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });

  locationInterval = setInterval(() => {
    if (isOnline) driverSocket.emit("driver-location", { driverId: API.user.id, lat: myLat, lng: myLng });
  }, LOCATION_UPDATE_INTERVAL);

  document.getElementById("toggle-online").onclick = () => {
    isOnline = !isOnline;
    const btn = document.getElementById("toggle-online");
    btn.textContent = isOnline ? "⛔ إيقاف" : "🟢 ابدأ استقبال";
    btn.style.background = isOnline ? "#28a745" : "#ffc107";
    btn.style.color = isOnline ? "#fff" : "#111";
    if (isOnline) {
      driverSocket.emit("driver-online", { driverId: API.user.id, name: API.user.name, carModel: API.user.carModel, carPlate: API.user.carPlate, lat: myLat, lng: myLng });
      notify("✅ بدأت");
    } else {
      driverSocket.emit("driver-offline", { driverId: API.user.id });
      notify("⛔ أوقفت");
    }
  };

  driverSocket.on("ride-confirmed", ({ rideId, ride, etaMin }) => {
    currentRide = { _id: rideId, ...ride, etaMin };
    document.getElementById("requests-list").innerHTML = '<div class="info-card"><h4>🧍 الزبون</h4><p><b>👤:</b> ' + (ride.customer ? ride.customer.name : "?") + '</p><p><b>📞:</b> ' + (ride.customer ? ride.customer.phone : "?") + '</p><p><b>📍:</b> ' + (ride.from.address || "موقع الزبون") + '</p><p><b>🏁:</b> ' + (ride.to.address || "الوجهة") + '</p><p><b>⏱️:</b> ' + etaMin + ' دقيقة</p><a href="tel:' + (ride.customer ? ride.customer.phone : "") + '" class="btn-call">📞 اتصال</a><button class="btn-arrived" style="background:#ff9800;color:#fff;margin-top:10px;width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer" onclick="arrivedAtCustomer()">📍 وصلت</button><button class="btn-danger" style="margin-top:10px;width:100%" onclick="cancelRideDriver()">❌ إلغاء</button><button class="btn-accept" style="background:#28a745;margin-top:8px" onclick="completeRide()">✅ إنهاء</button></div>';
    
    const fromLat = ride.from.lat, fromLng = ride.from.lng;
    const toLat = ride.to.lat, toLng = ride.to.lng;
    L.marker([fromLat, fromLng]).addTo(driverMap).bindPopup("🟢 الزبون").openPopup();
    L.marker([toLat, toLng]).addTo(driverMap).bindPopup("🔴 الوجهة");
    const tempLine = L.polyline([[fromLat, fromLng], [toLat, toLng]], { color: "#999", weight: 4, dashArray: "5, 10" }).addTo(driverMap);
    getRoute(fromLat, fromLng, toLat, toLng).then(route => {
      driverMap.removeLayer(tempLine);
      if (route) L.polyline(route.coordinates, { color: "#007bff", weight: 6, opacity: 0.85 }).addTo(driverMap);
      else L.polyline([[fromLat, fromLng], [toLat, toLng]], { color: "blue", weight: 5, dashArray: "10,10" }).addTo(driverMap);
    });
    driverMap.fitBounds([[fromLat, fromLng], [toLat, toLng], [myLat, myLng]], { padding: [50, 50] });
    notify("✅ تم القبول");
  });

  driverSocket.on("ride-request", (ride) => {
    if (currentRide || document.getElementById("ride-" + ride._id)) return;
    const card = document.createElement("div");
    card.className = "ride-card"; card.id = "ride-" + ride._id;
    const dInfo = ride.distanceToCustomer ? '<p style="color:#28a745"><b>📏:</b> ' + ride.distanceToCustomer + ' كم</p><p style="color:#007bff"><b>⏱️:</b> ' + ride.etaMin + ' دقيقة</p>' : "";
    card.innerHTML = '<h4>🚕 طلب جديد</h4>' + dInfo + '<p><b>👤:</b> ' + (ride.customer ? ride.customer.name : "?") + '</p><p><b>📞:</b> ' + (ride.customer ? ride.customer.phone : "?") + '</p><p><b>📍:</b> ' + (ride.from.address || "موقع الزبون") + '</p><p><b>🏁:</b> ' + (ride.to.address || "الوجهة") + '</p><button class="btn-accept" onclick="acceptRide(\'' + ride._id + '\', ' + (ride.etaMin || 0) + ')">✅ قبول</button>';
    document.getElementById("requests-list").appendChild(card);
    playBeep("new_ride");
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
    notify("🚕 طلب جديد");
  });

  driverSocket.on("ride-removed", ({ rideId }) => {
    document.getElementById("ride-" + rideId)?.remove();
    if (currentRide && currentRide._id === rideId) {
      currentRide = null; document.getElementById("requests-list").innerHTML = "";
      driverMap.eachLayer(l => { if ((l instanceof L.Polyline || l instanceof L.Marker) && l !== driverMarker) l.remove(); });
    }
  });

  driverSocket.on("ride-unavailable", ({ rideId }) => {
    document.getElementById("ride-" + rideId)?.remove(); notify("⚠️ سائق آخر أخذها");
  });

  driverSocket.on("customer-cancelled", ({ rideId }) => {
    document.getElementById("ride-" + rideId)?.remove();
    if (currentRide && currentRide._id === rideId) {
      currentRide = null; document.getElementById("requests-list").innerHTML = "";
      driverMap.eachLayer(l => { if ((l instanceof L.Polyline || l instanceof L.Marker) && l !== driverMarker) l.remove(); });
      notify("⚠️ الزبون ألغى");
    }
  });
}

window.arrivedAtCustomer = () => {
  if (!currentRide) return;
  if (!confirm("وصلت للزبون؟")) return;
  driverSocket.emit("driver-arrived", { rideId: currentRide._id, driverId: API.user.id });
  playBeep("arrived"); notify("✅ تم");
  const btn = document.querySelector(".btn-arrived");
  if (btn) { btn.textContent = "✅ تم"; btn.disabled = true; btn.style.background = "#28a745"; }
};

window.acceptRide = (rideId, etaMin) => {
  driverSocket.emit("accept-ride", { rideId, driverId: API.user.id, etaMin });
  const card = document.getElementById("ride-" + rideId);
  if (card) currentRide = { _id: rideId, etaMin };
  document.getElementById("requests-list").innerHTML = "";
  notify("⏳ جاري التأكيد...");
};

window.cancelRideDriver = () => {
  if (!currentRide || !confirm("إلغاء الطلب؟")) return;
  driverSocket.emit("cancel-ride", { rideId: currentRide._id, cancelledBy: "driver" });
  currentRide = null; document.getElementById("requests-list").innerHTML = "";
  driverMap.eachLayer(l => { if ((l instanceof L.Polyline || l instanceof L.Marker) && l !== driverMarker) l.remove(); });
  driverMap.setView([myLat, myLng], 15); notify("✅ تم الإلغاء");
};

window.completeRide = () => {
  if (!currentRide) return;
  driverSocket.emit("ride-completed", { driverId: API.user.id, rideId: currentRide._id });
  currentRide = null; document.getElementById("requests-list").innerHTML = "";
  driverMap.eachLayer(l => { if ((l instanceof L.Polyline || l instanceof L.Marker) && l !== driverMarker) l.remove(); });
  driverMap.setView([myLat, myLng], 15); notify("✅ تم الإنهاء");
};

// ═══════════════════════════════════════
// 🚀 النماذج
// ═══════════════════════════════════════
window.addEventListener("DOMContentLoaded", function() {
  console.log("🔄 DOM ready");
  
  var loginForm = document.getElementById("login-form");
  if (loginForm) {
    loginForm.addEventListener("submit", async function(e) {
      e.preventDefault();
      e.stopPropagation();
      var phone = document.getElementById("login-phone").value.trim();
      var password = document.getElementById("login-password").value;
      var errEl = document.getElementById("login-error");
      errEl.textContent = "";
      try {
        var res = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ phone: phone, password: password }) });
        var data = await res.json();
        if (data.error) { errEl.textContent = data.error; return; }
        saveSession(data.token, data.user);
        routeByRole();
      } catch (err) { errEl.textContent = "خطأ"; }
    });
  }
  
  var registerForm = document.getElementById("register-form");
  if (registerForm) {
    registerForm.addEventListener("submit", async function(e) {
      e.preventDefault();
      e.stopPropagation();
      var role = document.querySelector("input[name=role]:checked").value;
      var name = document.getElementById("reg-name").value.trim();
      var phone = document.getElementById("reg-phone").value.trim();
      var password = document.getElementById("reg-password").value;
      var carModel = document.getElementById("reg-car-model").value;
      var carPlate = document.getElementById("reg-car-plate").value;
      var errEl = document.getElementById("reg-error");
      errEl.textContent = "";
      
      try {
        try {
          var checkRes = await fetch("/api/check-block", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ deviceId: deviceFingerprint, phone: phone }) });
          var checkData = await checkRes.json();
          if (checkData.blocked) { errEl.textContent = "🚫 " + checkData.reason; return; }
        } catch (e) {}
        
        var res = await fetch("/api/auth/register", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: name, phone: phone, password: password, role: role, carModel: carModel, carPlate: carPlate, deviceId: deviceFingerprint }) });
        var data = await res.json();
        if (data.error) { errEl.textContent = data.error; return; }
        saveSession(data.token, data.user);
        routeByRole();
      } catch (err) { errEl.textContent = "خطأ"; }
    });
  }
  
  routeByRole();
});

</script>
